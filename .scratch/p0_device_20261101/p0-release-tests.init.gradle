// Local QA: release feature flags/permissions, development certificate, no optimization.
// The shipping R8 configuration in app/build.gradle.kts is unchanged.
gradle.beforeProject { project ->
    project.pluginManager.withPlugin('com.android.application') {
        def android = project.extensions.getByName('android')
        android.testBuildType = 'release'
        android.buildTypes.getByName('release').signingConfig = android.signingConfigs.getByName('debug')
        project.extensions.getByName('androidComponents').finalizeDsl { dsl ->
            dsl.buildTypes.getByName('release').optimization.enable = false
        }
    }
}
